name: ClawSweeper comment trigger

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: blocks-clawsweeper-comment-${{ github.event.repository.id }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit exact review command
    if: >-
      github.event.repository.full_name == 'dinkuskit/blocks' &&
      github.event.repository.id == 1306882611 &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@clawsweeper')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      requested: ${{ steps.admission.outputs.requested }}
      pr_number: ${{ steps.admission.outputs.pr_number }}
      base_sha: ${{ steps.admission.outputs.base_sha }}
      head_sha: ${{ steps.admission.outputs.head_sha }}
    steps:
      - name: Check out the trusted default-branch admission policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/clawsweeper-comment-admission.mjs
          sparse-checkout-cone-mode: false

      - name: Bind the authorized command to the live pull request tuple
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/clawsweeper-comment-admission.mjs

      - name: Mint the command acknowledgement token
        id: ack-token
        if: steps.admission.outputs.requested == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: dinkuskit
          repositories: blocks
          permission-issues: write
          permission-pull-requests: write

      - name: Post the pickup comment
        if: steps.admission.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ steps.ack-token.outputs.token }}
          PR_NUMBER: ${{ steps.admission.outputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "The pull request number is invalid." >&2
            exit 1
          fi
          marker="<!-- clawsweeper-review item=${PR_NUMBER} -->"
          payload="$(jq -n --arg marker "$marker" '{body: ("\ud83e\udd9e\ud83d\udc40\nClawSweeper picked this up.\n\nPull request received. I will update this comment when the review is ready.\n\n" + $marker)}')"
          comments="$(gh api --paginate "repos/dinkuskit/blocks/issues/${PR_NUMBER}/comments?per_page=100" | jq -s 'add // []')"
          existing="$(jq -r --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))] | first | .id // empty' <<<"$comments")"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/dinkuskit/blocks/issues/comments/${existing}" --input - <<<"$payload" >/dev/null
          else
            gh api -X POST "repos/dinkuskit/blocks/issues/${PR_NUMBER}/comments" --input - <<<"$payload" >/dev/null
          fi

      - name: Acknowledge the review command
        if: steps.admission.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ steps.ack-token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          if ! [[ "$COMMENT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The comment id is invalid." >&2
            exit 1
          fi
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "repos/dinkuskit/blocks/issues/comments/$COMMENT_ID/reactions" \
            -f content="eyes" >/dev/null || true

  review:
    name: Run pinned native ClawSweeper
    needs: admit
    if: needs.admit.outputs.requested == 'true'
    permissions:
      actions: read
      contents: read
    uses: dinkuskit/clawsweeper/.github/workflows/dinkuskit-native-canary.yml@80cdeb241ab529008b1082749584be28a318e9ca
    with:
      target_repository: blocks
      target_repository_id: "1306882611"
      pr_number: ${{ needs.admit.outputs.pr_number }}
      expected_base_sha: ${{ needs.admit.outputs.base_sha }}
      expected_head_sha: ${{ needs.admit.outputs.head_sha }}
      engine_sha: 80cdeb241ab529008b1082749584be28a318e9ca
      publish: true
    secrets:
      CLAWSWEEPER_APP_PRIVATE_KEY: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
